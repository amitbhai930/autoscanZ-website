<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan | AutoScanZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="container">
    <div class="logo">AutoScanZ</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="scan.html" class="active">Scan</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </nav>
    <!-- Theme toggle (optional, safe if unused) -->
    <button id="themeToggle" style="margin-left:10px;">☀️</button>
  </div>
</header>

<!-- ================= SCAN SECTION ================= -->
<section class="section">
  <div class="container scan-form">
    <h2>Run Security Scan</h2>
    <p>Enter a domain or IP address to start scanning.</p>

    <!-- REQUIRED INPUT -->
    <input
      type="text"
      id="target"
      placeholder="example.com or 8.8.8.8"
      autocomplete="off"
    />

    <!-- REQUIRED BUTTON -->
    <br /><br />
    <button id="scanBtn" class="btn-primary">
      Start Scan
    </button>

    <!-- STATUS MESSAGE -->
    <p id="status"></p>

    <!-- LOADING SPINNER -->
    <div
      id="spinner"
      class="spinner"
      style="display:none;"
    ></div>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="footer">
  <div class="container">
    <p style="text-align:center; color:#64748b;">
      © 2025 AutoScanZ. Scan only systems you own or have permission to test.
    </p>
  </div>
</footer>

<!-- ================= JS ================= -->
<script src="js/main.js"></script>

</body>
</html>
