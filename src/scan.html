<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan | AutoScanZ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="container">
    <div class="logo">AutoScanZ</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="scan.html" class="active">Scan</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="section">
 <div class="container scan-form">
  <h2>Run a Security Scan</h2>

  <input type="text" id="target" placeholder="example.com" required />
  <br />

  <button class="btn btn-primary" id="scanBtn">
    Start Scan
  </button>

  <div id="scanLoading" style="display:none;">
    <div class="spinner"></div>
    <div class="loading-text">Scanning in progress…</div>
  </div>

  <p id="status"></p>
</div>

</section>
<section class="section">
  <div class="container scan-form">
    <h2>Run Security Scan</h2>
    <p class="muted">Enter a domain or IP address</p>

    <input type="text" id="target" placeholder="example.com" />
    <br />
    <button class="btn" id="scanBtn">Scan Now</button>

    <p id="status"></p>
    <div id="spinner" class="spinner" style="display:none;"></div>

  </div>
</section>

<script src="js/main.js"></script>

</body>
</html>
