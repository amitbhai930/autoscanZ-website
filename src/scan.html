<section class="cta">
  <div class="container">
    <h2>Start a Security Scan</h2>
    <p>Enter a domain or IP address to begin scanning.</p>

    <form id="scanForm">
      <input
        type="text"
        id="target"
        placeholder="example.com"
        required
        style="padding:10px; width:280px;"
      />
      <br /><br />
      <button class="btn-primary" type="submit">Start Scan</button>
    </form>

    <p id="status" style="margin-top:15px;"></p>
  </div>
</section>

<script src="js/main.js"></script>
